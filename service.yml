service:
  name: aac-portainer
  image_repo: portainer/portainer-ce
  image_tag: 2.45.3
  description: Portainer Server für die Site Hetzner
  icon: portainer.png
  category: Management
  stage: prod
  hostname: aac-portainer
ports:
- name: web
  port: 9443
  protocol: TCP
  external_port: 9222
- name: edge
  port: 8000
  protocol: TCP
  external_port: 8000
- name: legacy-api
  port: 9000
  protocol: TCP
  external_port: 9111
config:
  domain_name: example.com
  generate_hostname: false
  integrations:
    traefik:
      enabled: true
      cert_resolver: ionos
      entrypoint: websecure
      service_scheme: http
      service_port: 9000
    homepage:
      enabled: true
    autodns:
      enabled: true
      create_wildcard: true
  schema_version: 2
stage_overrides:
  prod:
    service:
      hostname: portainer
    config:
      generate_hostname: false
volumes:
  data:
    description: Persistent data for Portainer
  docker-sock:
    description: Docker socket for container management
    type: bind
    source: /var/run/docker.sock
deployment_strategy:
  main:
    enabled: true
    target_stage: prod
  dev:
    enabled: true
    target_stage: dev
  test:
    enabled: false
    target_stage: test
  ansible-dev:
    enabled: true
    target_stage: dev
  iac-dev:
    enabled: true
    target_stage: dev
  template-dev:
    enabled: true
    target_stage: dev
deployments:
  docker_compose:
    restart_policy: always
    host_base_path: /export/docker
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '10'
    volumes:
    - data:/data
    - docker-sock:/var/run/docker.sock
    environment:
      PUID: '{{ vars.PUID }}'
      PGID: '{{ vars.PGID }}'
      TZ: '{{ vars.TZ }}'
vars:
  PUID: '1000'
  PGID: '1000'
  TZ: Europe/Berlin
secrets: {}
